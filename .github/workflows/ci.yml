name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: PHP Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, zip, bcmath, mbstring, pcntl, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: moodflow-api/vendor
          key: composer-${{ hashFiles('moodflow-api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: moodflow-api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        working-directory: moodflow-api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: moodflow-api
        run: php artisan test

  frontend:
    name: Nuxt Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: moodflow-client/package-lock.json

      - name: Install dependencies
        working-directory: moodflow-client
        run: npm ci

      - name: Build
        working-directory: moodflow-client
        run: npm run build
