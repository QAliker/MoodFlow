services:
  api:
    build:
      context: ./moodflow-api
      dockerfile: Dockerfile
    container_name: moodflow_api
    working_dir: /var/www/api
    volumes:
      - ./moodflow-api:/var/www/api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moodflow

  reverb:
    build:
      context: ./moodflow-api
      dockerfile: Dockerfile
    container_name: moodflow_reverb
    working_dir: /var/www/api
    volumes:
      - ./moodflow-api:/var/www/api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - api
    networks:
      - moodflow

  client:
    build:
      context: ./moodflow-client
      dockerfile: Dockerfile
    container_name: moodflow_client
    working_dir: /app
    volumes:
      - ./moodflow-client:/app
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_URL=${NUXT_PUBLIC_API_URL:-http://localhost:8000}
      - NUXT_PUBLIC_REVERB_HOST=${REVERB_HOST:-localhost}
      - NUXT_PUBLIC_REVERB_PORT=${REVERB_PORT:-8080}
    depends_on:
      - api
    networks:
      - moodflow

  postgres:
    image: postgres:16-alpine
    container_name: moodflow_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - moodflow

  redis:
    image: redis:7-alpine
    container_name: moodflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - moodflow

volumes:
  postgres_data:
  redis_data:

networks:
  moodflow:
    driver: bridge
